<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login/Register</title>
</head>
<body>
    <div style="display: flex; flex-direction: column">
        <h3>Login Form</h3>

        <form action="http://localhost:8080/login" method="post">
            <label for="login_username">Username: </label>
            <input type="text" id="login_username" name="login_username"/>

            <label for="login_password">Password: </label>
            <input type="password" id="login_password" name="login_password"/>

            <button type="submit">Submit</button>
        </form>
    </div>

    <div>
        <h3>Registration Form</h3>
        <form action="http://localhost:8080/new/business" method="post">
            <label for="registration_username">Username: </label>
            <input type="text" id="registration_username" name="registration_username"/>

            <label for="registration_password">Password: </label>
            <input type="password" id="registration_password" name="registration_password"/>

            <label for="account_type">Account Type</label>
            <select name="account_type" id="account_type">
                <option value="client">Client</option>
                <option value="business">Business</option>
            </select>

            <label for="registration_name">Name</label>
            <input type="text" name="registration_name" id="registration_name"/>

            <label for="registration_email">Email</label>
            <input type="email" name="registration_email" id="registration_email"/>

            <button type="submit">Submit</button>
        </form>
    </div>


    <div>
        <h3>Guest Form</h3>
        <form action="http://localhost:8080/new/guest" method="post">
            <label for="guest_username">Username: </label>
            <input type="text" name="guest_username" id="guest_username"/>

            <label for="guest_email">Email:</label>
            <input type="email" name="guest_email" id="guest_email"/>
            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
